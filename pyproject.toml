[project]
name = "paideia"
version = "0.1.0"
description = "Raising small language-model pets with RL to study how training shapes character"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paideia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]  # code in the docs is illustrative, not formatted

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
